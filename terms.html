<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regulamin | VDS Shop</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
      line-height: 1.6;
    }
    .page-wrapper {
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }
    header {
      width:100%;
      background: #020202;
      color: #fff;
      padding: 20px 24px;
      align-content: center;
      text-align: center;
      font-size: 2.25rem;
    }
    header .logo {
      font-size: 1.25rem;
      font-weight: bold;
      margin: 0;
    }
    nav {
      margin-top: 12px;
    }
    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-right: 18px;
      font-size: 0.95rem;
    }
    nav a:hover {
      color: #fff;
    }
    main {
      flex: 1;
      max-width: 1200px;
      margin: 10px auto;
      padding: 0 10px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      border-radius: 12px;
    }
    .content {
      padding: 32px;
    }
    .content h1 {
      margin-top: 0;
      color: #111827;
    }
    .content h2 {
      margin-top: 28px;
      color: #1e293b;
    }
    .content p {
      margin: 16px 0;
    }
    .content img {
      width: 100%;
      height: auto;
    }
    footer {
      width: 100%;
      background: #000000;
      color: #94a3b8;
      text-align: center;
      padding: 16px 24px;
      font-size: 0.9rem;
      position: sticky bottom: 0;
      bottom: 0;
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <header>
      <p class="logo">VDS ensemble</p>
      <nav>
        <a href="index.html">Strona główna</a>
       
      </nav>
    </header>
    <main>
      <div class="content">
        <h1>Regulamin</h1>

        <img class="p-image--shadowed" src="./images/terms_.jpg" alt="warunki realizacji zamówień, regulamin">
        
    </main>
    <footer>
      &copy; 2026 VDS ensemble
    </footer>
  </div>
</body>
</html>
