<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="./imgages/icon.jpg" type="image/jpg">

<body>
    

        
<div class="wrapper">   
    <header class="header">
        <div id="logotype"><img src="./images/vds-logo.png" width="110"></div>
        
    </header>
            
    <div class="space">     
    </div>
<div class="title">
            <h3>  Ultimate Black Hoodie </h3>  
            <div class="divider"></div>
    </div>


   <!-- FORMULARZ DANYCH -->
<section class="shipping-box">
    <div class="box-title">Dane do wysyłki</div>

    <form class="shipping-form">

        <div class="form-row">
            <div class="form-field">
                <label for="first-name">Imię</label>
                <input type="text" id="first-name" name="first-name" required>
            </div>

            <div class="form-field">
                <label for="last-name">Nazwisko</label>
                <input type="text" id="last-name" name="last-name" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-field full">
                <label for="address">Adres</label>
                <input type="text" id="address" name="address" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-field full">
                <label for="city">Miasto</label>
                <input type="text" id="city" name="city" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-field">
                <label for="postal">Kod pocztowy</label>
                <input type="text" id="postal" name="postal" required>
            </div>

            <div class="form-field">
                <label for="phone">Telefon kontaktowy</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
        </div>

    </form>
</section>



    <!-- KOSZYK -->
    <section class="cart-box">
        <h2 class="box-title">Koszyk</h2>

        <div class="cart-item">
            <div class="item-thumb"></div>
            <div class="item-name">Ultimate Black Hoodie</div>
            <div class="item-size">S</div>
            <div class="item-price">450 PLN</div>
        </div>

    

    <!-- PODSUMOWANIE -->
        <section class="summary-box">
            <div class="summary-row">
             <span>Razem:</span>
             <span class="summary-price">450 PLN</span>
         </div>

            <button class="payment-btn">Payment</button>
        </section>
    
    </section>




<script type="module">
  import { Cart } from "./cart.js";

  const cart = new Cart();
  const products = cart.getProducts();
  const list = document.querySelector(".order-list");
  const totalEl = document.querySelector(".total-price");
  if (products.length === 0) {
    list.innerHTML = `<p class="empty-cart">Your cart is empty.</p>`;
    totalEl.textContent = "0,00 PLN";
  } else {
    list.innerHTML = products.map(p => `
      <div class="order-item">
        <span class="item-name">${p.name}</span>
        <span class="item-price">${(p.price / 100).toFixed(2)} PLN</span>
      </div>`).join("");
    const total = products.reduce((sum, p) => sum + p.price, 0);
    totalEl.textContent = `${(total / 100).toFixed(2)} PLN`;
  }

  document.getElementById("payment-btn").addEventListener("click", () => {
    console.log("user buys products", products);
  });
</script>

            


        
        </section>
        
<section id="credits"> 
    <hr>
    <h1>Thanks for your purchase!</h1>
    <hr>
</section>
        
</section> 




        
    
<footer id="basket-footer">
